<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU SPEAKS</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap} input{flex:1;min-width:140px;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
button.stop{background:transparent;color:var(--ink);border:1px solid var(--line)}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header><h1>TRU <span>SPEAKS</span></h1><p class="sub">Reads a packed line aloud. Stops. Does not listen.</p></header>
<div class="warn">Save the file. Open it in a browser. Speech stays on this phone. This page does not take a spoken yes. Tap Read.</div>
<div class="bar"><input id="q" placeholder="storm, water, fire…" enterkeyhint="search"><button id="send">Send</button><button class="stop" id="stop">Stop</button></div>
<main id="out"></main>
<script>
var C=[
{s:"Water",t:"Settle first",d:"Let mud settle. Pour the clear water through a clean cloth. Then disinfect. Dose is not a substitute for settling.",k:"water hurricane storm drink power"},
{s:"Water",t:"Bleach, clear water",d:"Regular unscented household bleach, 4 to 6 percent. Clear water: 8 drops per gallon, or 2 drops per quart. Double if the water is cloudy.",k:"water bleach gallon storm"},
{s:"Fire",t:"The circle",d:"Clear a circle at least 1 meter across so the fire has little chance to spread. Scrape to soil.",k:"fire heat cook storm"},
{s:"Fire",t:"Dead out",d:"Water it. Stir the ash. Water it again. If you can still feel heat, it is not out.",k:"fire dead out ember"},
{s:"Shelter",t:"Small enough",d:"The most common error is to make the shelter too large. Large enough to protect you, small enough to hold your body heat.",k:"shelter storm rain sleep"},
{s:"Shelter",t:"Lean-to",d:"Poncho lean-to. Back into the wind. The fire stays outside, on the open side.",k:"shelter poncho lean-to"},
{s:"Cold",t:"COLD",d:"Clean. Avoid overheating. Loose, and in layers. Dry.",k:"cold freeze layers storm"},
{s:"Salt",t:"Not a drink",d:"Seawater is not a drink. The body spends water to shed the salt.",k:"salt sea drink"},
{s:"Sun",t:"Fist",d:"A fist at arm's length between the sun and a clear horizon is about an hour of light. Not a minute.",k:"sun light fist dark"},
{s:"Quiet",t:"Three tells",d:"Light, sound, and smoke give a camp away. Close one and the other two still talk.",k:"quiet light smoke sound"},
{s:"Signal",t:"Three",d:"Three of anything. Three fires, three blasts, three flashes. SOS is three short, three long, three short.",k:"signal sos help found"}
];
var STORM=["Settle first","The circle","Dead out","Small enough","COLD"];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&","<":"<",">":">"}[c];});}
function say(text){
  if(!("speechSynthesis" in window)){return;}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.rate=0.95;
  window.speechSynthesis.speak(u);
}
function sayMany(lines){
  if(!("speechSynthesis" in window)){return;}
  window.speechSynthesis.cancel();
  lines.forEach(function(line){
    var u=new SpeechSynthesisUtterance(line);
    u.rate=0.95;
    window.speechSynthesis.speak(u);
  });
}
function card(x){
  return '<article class="card"><div class="k">'+esc(x.s)+'</div><div class="big">'+esc(x.t)+'</div><div>'+esc(x.d)+'</div><div class="src">Packed line. Not a new fact.</div><div class="row"><button data-say="'+esc(x.t)+'. '+esc(x.d)+'">Read</button></div></article>';
}
function show(q){
  q=(q||"").trim().toLowerCase();
  var box=document.getElementById("out");
  var storm=q && ("storm hurricane power weeks dark outage".split(" ").some(function(w){return q.indexOf(w)>=0;}));
  var h=C.filter(function(x){return !q || (x.s+" "+x.t+" "+x.d+" "+x.k).toLowerCase().indexOf(q)>=0 || (storm && STORM.indexOf(x.t)>=0);});
  if(!h.length){box.innerHTML='<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No line to read. This page does not invent one.</div></article>';return;}
  var head=storm?'<article class="card"><div class="k">STORM</div><div class="big">Four weeks, no power</div><div>Water, fire, shelter, cold. The packed lines only.</div><div class="row"><button id="storm">Read the storm</button></div></article>':"";
  box.innerHTML=head+h.map(card).join("");
  var b=document.getElementById("storm");
  if(b) b.onclick=function(){sayMany(STORM.map(function(t){var x=C.filter(function(c){return c.t===t;})[0];return x.t+". "+x.d;}));};
  Array.prototype.forEach.call(box.querySelectorAll("button[data-say]"),function(btn){btn.onclick=function(){say(btn.getAttribute("data-say"));};});
}
document.getElementById("send").onclick=function(){show(document.getElementById("q").value);};
document.getElementById("q").onkeydown=function(e){if(e.key==="Enter") show(e.target.value);};
document.getElementById("stop").onclick=function(){if("speechSynthesis" in window) window.speechSynthesis.cancel();};
show("");
</script>
</body>
</html>
